    children:
      burp:
        title: Burp Suite
        description: 插件、拦截、扫描与扩展。
      nmap:
        title: Nmap
        description: 扫描、脚本与规避。
      metasploit:
        title: Metasploit
        description: 模块、payload 与利用。
      frida:
        title: Frida
        description: Hook、插桩与自动化。
      ida:
        title: IDA
        description: 反汇编、脚本与插件。
      ghidra:
        title: Ghidra
        description: 反编译、脚本与协作。
