    children:
      protocol:
        title: IoT 协议
        description: MQTT、CoAP、Modbus、Zigbee 等。
      hardware:
        title: 硬件
        description: UART/JTAG/SPI、侧信道与故障注入。
      industrial:
        title: 工业控制
        description: PLC、SCADA、DCS 与 OT 协议。
      vehicle:
        title: 车联网
        description: 车机、T-Box、车载总线、蓝牙/ADB/GPS 与车云接口。
  blockchain:
    title: 区块链
    description: 智能合约、DeFi、钱包与共识安全。
