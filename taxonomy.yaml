    description: 红队与渗透流程、权限提升、横向与持久化。
    children:
      recon:
        title: 信息收集
        description: 资产发现、指纹、子域与泄露情报。
      initial-access:
        title: 初始访问
        description: 边界突破、钓鱼、暴露面与凭据。
      privilege-escalation:
        title: 权限提升
        description: Windows/Linux/云/应用提权。
      lateral-movement:
        title: 横向移动
        description: 凭据传递、远程执行与域内移动。
      persistence:
        title: 持久化
        description: 计划任务、服务、启动项与后门。
      c2:
        title: C2
        description: 命令控制、隐蔽通道与基础设施。
      ad:
        title: Active Directory
