        description: 函数计算、事件注入与权限。
      ci-cd:
        title: CI/CD
        description: 流水线、凭据、供应链与投毒。
      cloud-iam:
        title: 云 IAM
        description: 权限提升、角色链、跨账号与策略缺陷。
      metadata:
        title: 云元数据
        description: 元数据服务、SSRF 与临时凭证。
  iot:
    title: IoT/工控
