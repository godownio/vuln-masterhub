baseURL: https://example.org/
title: Godown 安全知识库
locale: zh_CN
defaultContentLanguage: zh-cn
enableGitInfo: false
disableKinds: [taxonomy, term]
segments:
  homepage:
    includes:
      - kind: home
outputs:
  home: [HTML]
  section: [HTML]
  taxonomy: [HTML]
  term: [HTML]
module:
  imports:
    - path: github.com/imfing/hextra
markup:
  goldmark:
    renderer:
      unsafe: false
params:
  description: Godown 的安全知识库，按目录树和场景卡片浏览。
  search:
    flexsearch:
      index: title
  theme:
    default: system
    displayToggle: true
  navbar:
    displayTitle: true
  footer:
    displayCopyright: true
    displayPoweredBy: false
menu:
  main:
    - name: 知识库
      pageRef: /
      weight: 1
    - name: API Key 控制台
      url: /console/
      weight: 2
    - name: 关于我
      pageRef: /about
      weight: 3
    - name: 原博客
      url: https://godownio.github.io/
      weight: 4
