name: Publish private backend to Hugging Face
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Verified runtime snapshot release tag
        required: true
        default: cloud-snapshot-20261110
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: hf-space
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HF_OIDC_RESOURCE: spaces/godownio/vuln-masterhub
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'huggingface_hub>=1.19' requests PyYAML
      - name: Download verified snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release download "$RELEASE_TAG" --pattern space-runtime.zip --pattern space-runtime.sha256 --dir incoming
      - name: Verify and extract snapshot
        run: |
          cd incoming
          sha256sum --check space-runtime.sha256
          python - <<'PY'
          from pathlib import Path
          import zipfile
          root=Path('../runtime').resolve()
          with zipfile.ZipFile('space-runtime.zip') as z:
              for entry in z.infolist():
                  target=(root/entry.filename).resolve()
                  assert target.is_relative_to(root)
                  assert not entry.filename.endswith(('portal.sqlite','portal-secrets.json','portal-session-secret','.env'))
              z.extractall(root)
          PY
      - name: Prepare single-file SDK dependencies
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('runtime')
          path=root/'requirements.txt'
          text=path.read_text()
          text=text.replace('-r requirements-base.txt',(root/'requirements-base.txt').read_text().strip())
          path.write_text(text)
          manifest_path=root/'release-manifest.json'
          manifest=json.loads(manifest_path.read_text())
          manifest['files']['requirements.txt']=hashlib.sha256(path.read_bytes()).hexdigest()
          manifest_path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2))
          PY
      - name: Apply current cloud entry point
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,shutil
          root=Path('runtime')
          shutil.copyfile('deploy/space_app.py',root/'app.py')
          path=root/'release-manifest.json'
          manifest=json.loads(path.read_text())
          manifest['files']['app.py']=hashlib.sha256((root/'app.py').read_bytes()).hexdigest()
          path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2))
          PY
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      - name: Build current homepage and static assets
        run: |
          curl -fsSL https://github.com/gohugoio/hugo/releases/download/v0.169.0/hugo_extended_0.169.0_linux-amd64.tar.gz | tar -xz -C /usr/local/bin hugo
          python tools/export_hugo.py
          hugo --source hugo-site --renderSegments homepage --minify --baseURL https://godownio-vuln-masterhub.hf.space/
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,shutil
          source=Path('hugo-site/public')
          shutil.copytree(source,'runtime/hugo-site/public',dirs_exist_ok=True)
          path=Path('runtime/release-manifest.json')
          manifest=json.loads(path.read_text())
          for file in source.rglob('*'):
              if file.is_file():
                  manifest['files']['hugo-site/public/'+file.relative_to(source).as_posix()]=hashlib.sha256(file.read_bytes()).hexdigest()
          path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2))
          PY
      - name: Upload lightweight runtime and verified release pointer
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          from huggingface_hub import HfApi
          root=Path('runtime')
          pointer={'url':'https://github.com/godownio/vuln-masterhub/releases/download/'+os.environ['RELEASE_TAG']+'/space-runtime.zip','sha256':hashlib.sha256(Path('incoming/space-runtime.zip').read_bytes()).hexdigest()}
          (root/'cloud-release.json').write_text(json.dumps(pointer))
          HfApi().upload_folder(repo_id='godownio/vuln-masterhub',repo_type='space',folder_path=str(root),allow_patterns=['app.py','README.md','requirements*.txt','web/**','tools/**','taxonomy.yaml','cloud-release.json'],commit_message='Deploy verified knowledge release pointer')
          PY
      - name: Check Space runtime status
        timeout-minutes: 12
        run: |
          python - <<'PY'
          import time
          from huggingface_hub import HfApi
          api=HfApi()
          ready=0
          for attempt in range(30):
              runtime=api.space_info('godownio/vuln-masterhub').runtime
              stage=runtime.stage if runtime else 'UNKNOWN'
              print('Space runtime:',stage,flush=True)
              if stage in ('BUILD_ERROR','RUNTIME_ERROR','CONFIG_ERROR'):
                  raise SystemExit('Space failed to start; inspect platform logs')
              ready=ready+1 if stage=='RUNNING' else 0
              if ready>=2:
                  break
              time.sleep(20)
          else:
              raise SystemExit('Space readiness timed out')
          PY
